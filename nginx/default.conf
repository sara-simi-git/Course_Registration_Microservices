events {}
http {
    upstream course_catalog {
        server catalog.api1:8080 max_fails=3 fail_timeout=10s;
        server catalog.api2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://course_catalog;
            proxy_pass_header X-Service-Instance;
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Load-Balancer-Node $hostname always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
